# 500 decoder queries instead of 300, so that dense frames and the 500-box Kaggle limit can be
# used; learning rates as in qb1.
name: qb2_q500_1152
family: query_based
arch: rtdetr
model: configs/models/rtdetr-l-q500.yaml
weights: rtdetr-l.pt
data: data/yolo/fold0_s10/data.yaml
imgsz: 1152
backbone_lr_scale: 0.1
train: {epochs: 30, batch: 2, workers: 4, optimizer: AdamW, lr0: 0.0001, weight_decay: 0.0001}
