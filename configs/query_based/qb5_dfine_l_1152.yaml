# D-FINE-L, pretrained on Objects365 and COCO, in place of RT-DETR-l. The learning rates follow the
# paper divided for a smaller batch, the backbone gets a tenth of the rate. Random crops replace
# mosaic, so the small objects are also seen zoomed in, as in the tiles.
name: qb5_dfine_l_1152
family: query_based
arch: dfine
model: ustc-community/dfine-large-obj2coco-e25
data: data/yolo/fold0_s5/data.yaml
imgsz: 1152
checkpoint: last
train: {epochs: 6, batch: 2, accumulate: 4, lr: 0.0001, backbone_lr_scale: 0.1, weight_decay: 0.000125, warmup_steps: 200, workers: 1}
