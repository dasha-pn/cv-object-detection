# Second final fit of D-FINE-L on all train and val clips, with crops down to 35% of the frame side
# as in qb7, so it differs from f3 in what it sees. The run is not scored.
name: f6_dfine_l_crop035_full
family: pipeline
arch: dfine
model: ustc-community/dfine-large-obj2coco-e25
data: data/yolo/full_s5/data.yaml
imgsz: 1152
checkpoint: last
evaluate: false
train: {epochs: 6, batch: 2, accumulate: 4, lr: 0.0001, backbone_lr_scale: 0.1, weight_decay: 0.000125, warmup_steps: 200, workers: 0, min_crop: 0.35}
