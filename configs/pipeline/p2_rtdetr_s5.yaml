# Data change only: qb0 (the best detector so far) trained on every 5th frame of folds 1-2
# instead of every 10th. Twice the frames for half the epochs, so the number of iterations,
# the warm-up and the iterations without mosaic are the same as in qb0.
name: p2_rtdetr_s5
family: pipeline
arch: rtdetr
model: rtdetr-l.pt
data: data/yolo/fold0_s5/data.yaml
imgsz: 1152
train: {epochs: 15, close_mosaic: 5, warmup_epochs: 1.5, batch: 2, workers: 4}
