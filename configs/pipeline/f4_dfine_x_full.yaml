# Final fit of qb6 (D-FINE-X) on every 5th frame of all train and val clips. The evaluation clips
# are part of the training data, so the run is not scored.
name: f4_dfine_x_full
family: pipeline
arch: dfine
model: ustc-community/dfine-xlarge-obj2coco
data: data/yolo/full_s5/data.yaml
imgsz: 1152
checkpoint: last
evaluate: false
train: {epochs: 6, batch: 1, accumulate: 8, lr: 0.0001, backbone_lr_scale: 0.1, weight_decay: 0.000125, warmup_steps: 200, workers: 1}
