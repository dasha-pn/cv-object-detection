# Second final fit, a partner of f1 in the ensemble: the short schedule of p3 (Ultralytics default
# learning rate, 5 epochs, scored with last.pt) on every 5th frame of all train and val clips.
# On val the ensemble gains the most from models trained with different recipes. The evaluation
# clips are part of the training data, so the run is not scored.
name: f2_rtdetr_full_short
family: pipeline
arch: rtdetr
model: rtdetr-l.pt
data: data/yolo/full_s5/data.yaml
imgsz: 1152
checkpoint: last
evaluate: false
train: {epochs: 5, close_mosaic: 2, warmup_epochs: 1, batch: 2, workers: 1}
